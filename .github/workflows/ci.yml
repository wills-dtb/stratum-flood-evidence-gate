name: Evidence gate CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m src.gate fixtures/safe.json --out out/safe
      - run: |
          if python -m src.gate fixtures/unsafe.json --out out/unsafe; then
            echo 'Expected unsafe assessment to fail' >&2
            exit 1
          fi
